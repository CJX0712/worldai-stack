name: ci

# Continuous integration on a clean machine: byte-compile gate, advisory
# dependency install, unit tests and the project self-verification script.
# Author: 晨星

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Byte-compile gate (hard)
        run: python -m compileall -q -x '\.git|\.venv|node_modules' .

      - name: Install dependencies (offline-friendly, advisory)
        run: |
          python -m pip install --upgrade pip
          for f in requirements.txt requirements-dev.txt requirements.lock.txt; do
            [ -f "$f" ] || continue
            grep -viE '^(llama[-_]cpp[-_]python|pywin32|audioop-lts)' "$f" > "/tmp/f_$f" || true
            python -m pip install -r "/tmp/f_$f" || echo "::warning::install from $f failed (advisory)"
          done
          python -m pip install pytest || echo "::warning::pytest install failed (advisory)"

      - name: Unit tests
        env:
          # 本仓库是 src/ 布局（pyproject 里 package-dir = src），`import worldai`
          # 在干净 checkout 里解析不到——tests/*.py 全部按 `from worldai.x import y`
          # 导入，于是整批用例在收集阶段 ModuleNotFoundError。
          # scripts/verify.py 的第 3 阶段自己就设了 PYTHONPATH=SRC，CI 这一步漏了。
          PYTHONPATH: src
        run: |
          if [ -d tests ]; then
            python -m pytest tests -q
          else
            echo "no tests/ directory - skipping"
          fi

      - name: Self-verification script
        run: |
          for s in scripts/verify.py scripts/selfcheck.py tools/verify.py; do
            if [ -f "$s" ]; then echo "== $s"; python "$s"; exit $?; fi
          done
          echo "no verification script found"
